[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comma-deps-git-xet"
version = "0.2.2"
description = "Native Git LFS Xet upload and download transfer agent"
requires-python = ">=3.12"

[project.scripts]
git-xet = "git_xet:_run"

[tool.setuptools]
packages = ["git_xet"]
include-package-data = false

[tool.setuptools.package-data]
git_xet = ["bin/**/*"]
