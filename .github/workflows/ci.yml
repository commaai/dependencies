name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ (github.repository == 'commaai/dependencies' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'commaai/dependencies')) && matrix.runs-on-namespace || matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
            runs-on-namespace: namespace-profile-amd64-8x16
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
            runs-on-namespace: namespace-profile-arm64-big
          - platform: macos
            runs-on: macos-latest
            runs-on-namespace: namespace-profile-macos-8x14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for `git rev-list --count` versioning
      - name: Select Xcode 16
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            echo "Selected: $XCODE"
            sudo xcode-select -s "$XCODE"
          fi
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          key: native-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: native-${{ matrix.platform }}-
          path: .native-cache
      - uses: actions/cache/restore@v6
        id: ccache
        with:
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-
          path: .ccache
      - name: Build wheels
        id: build
        env:
          MANYLINUX: ${{ runner.os == 'Linux' && '1' || '0' }}
          UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
          DEPENDENCIES_NATIVE_CACHE: .native-cache
        run: |
          ./build.sh
          [[ ! -e .native-cache/.changed ]] || echo "native-cache-changed=1" >> "$GITHUB_OUTPUT"
      # only when a package was rebuilt; restored packages are already in the cache
      - uses: actions/cache/save@v6
        if: steps.build.outputs.native-cache-changed
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: .native-cache
      # PR caches can't be shared with other branches, so only master's are worth saving
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: .ccache
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl

  test:
    name: test distro (${{ matrix.image }})
    needs: build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            runs-on: ubuntu-latest
          - image: ubuntu:24.04
            runs-on: ubuntu-latest
          - image: fedora:41
            runs-on: ubuntu-latest
          - image: archlinux:latest
            runs-on: ubuntu-latest
          - image: opensuse/tumbleweed:latest
            runs-on: ubuntu-latest
          - image: ghcr.io/void-linux/void-glibc:latest
            runs-on: ubuntu-latest
          - image: debian:trixie-slim
            runs-on: ubuntu-24.04-arm
          # TODO: add musl test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ contains(matrix.runs-on, 'arm') && 'wheels-linux-arm64' || 'wheels-linux-x86_64' }}
          path: dist/
      - run: ./test_wheels_in_image.sh "${{ matrix.image }}"

  publish:
    name: publish wheels
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PAT }}
        run: ./release.sh
