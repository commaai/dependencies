name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
          - platform: macos
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        run: ./build.sh ${{ runner.os == 'Linux' && '--manylinux' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl

  test:
    name: test distro (${{ matrix.image }})
    needs: build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            runs-on: ubuntu-latest
          - image: ubuntu:24.04
            runs-on: ubuntu-latest
          - image: ubuntu:20.04
            runs-on: ubuntu-latest
          - image: fedora:41
            runs-on: ubuntu-latest
          - image: archlinux:latest
            runs-on: ubuntu-latest
          - image: opensuse/tumbleweed:latest
            runs-on: ubuntu-latest
          - image: ghcr.io/void-linux/void-glibc:latest
            runs-on: ubuntu-latest
          - image: debian:bookworm-slim
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ${{ contains(matrix.runs-on, 'arm') && 'wheels-linux-arm64' || 'wheels-linux-x86_64' }}
          path: wheels
      - name: Build test container
        run: |
          docker build -t wheeltest -f - . <<'DOCKERFILE'
          FROM ${{ matrix.image }}
          RUN if command -v apk >/dev/null; then \
                apk add --no-cache python3 py3-pip bash; \
              elif command -v apt-get >/dev/null; then \
                apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python3-venv; \
              elif command -v dnf >/dev/null; then \
                dnf install -y python3 python3-pip; \
              elif command -v pacman >/dev/null; then \
                pacman -Sy --noconfirm python python-pip; \
              elif command -v zypper >/dev/null; then \
                zypper install -y python3 python3-pip; \
              elif command -v xbps-install >/dev/null; then \
                xbps-install -Sy python3 python3-pip bash; \
              fi
          DOCKERFILE
      - name: Test wheels in distro
        run: |
          docker run --rm -v "$PWD:/work" -w /work wheeltest bash -lc '
            set -euo pipefail
            python3 -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --upgrade pip >/dev/null
            /tmp/venv/bin/python -m pip install wheels/*.whl
            for toml in */pyproject.toml; do
              module="$(basename "$(dirname "$toml")" | tr "-" "_")"
              /tmp/venv/bin/python -c "import $module; $module.smoketest()" && echo "$module: OK"
            done
          '

  publish:
    name: publish wheels
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish wheels and shims
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release.sh --publish-only --publish-shims
