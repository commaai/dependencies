name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ (github.repository == 'commaai/dependencies' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'commaai/dependencies')) && matrix.runs-on-namespace || matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash -e {0}' }} # the implicit default; a bare `bash` would add pipefail
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
            runs-on-namespace: namespace-profile-amd64-8x16
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
            runs-on-namespace: namespace-profile-arm64-big
          - platform: macos
            runs-on: macos-latest
            runs-on-namespace: namespace-profile-macos-8x14
          - platform: windows-x86_64
            runs-on: windows-latest
            shell: msys2 {0} # the CLANG64 shell from setup-msys2 below
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for `git rev-list --count` versioning
      - name: Select Xcode 16
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            echo "Selected: $XCODE"
            sudo xcode-select -s "$XCODE"
          fi
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
      - uses: actions/cache@v6
        with:
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-
          path: .ccache
      - uses: actions/cache@v6
        with:
          key: downloads-${{ matrix.platform }}-${{ hashFiles('gcc-arm-none-eabi/build.sh', 'git-lfs/build.sh') }}
          path: |
            .uv-cache
            */*/toolchain
            */*/bin
      - name: Install MSYS2 build dependencies
        if: runner.os == 'Windows'
        run: ./setup.sh
      - name: Build wheels
        env:
          MANYLINUX: ${{ runner.os == 'Linux' && '1' || '0' }}
          UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
          BUILD_SH_REUSE_MANYLINUX_ARTIFACTS: "1"
        run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl

  test:
    name: test distro (${{ matrix.image }})
    needs: build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            runs-on: ubuntu-latest
          - image: ubuntu:24.04
            runs-on: ubuntu-latest
          - image: fedora:41
            runs-on: ubuntu-latest
          - image: archlinux:latest
            runs-on: ubuntu-latest
          - image: opensuse/tumbleweed:latest
            runs-on: ubuntu-latest
          - image: ghcr.io/void-linux/void-glibc:latest
            runs-on: ubuntu-latest
          - image: debian:trixie-slim
            runs-on: ubuntu-24.04-arm
          # TODO: add musl test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ contains(matrix.runs-on, 'arm') && 'wheels-linux-arm64' || 'wheels-linux-x86_64' }}
          path: dist/
      - run: ./test_wheels_in_image.sh "${{ matrix.image }}"

  test-windows:
    name: test windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-x86_64
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the wheels into a clean venv and run the smoketests
        # a stock Python with no MSYS2 on PATH: catches a wheel that still depends on the toolchain's DLLs
        shell: bash
        run: |
          python -m venv venv
          source venv/Scripts/activate
          pip install dist/*.whl
          for toml in */pyproject.toml; do
            module="$(basename "$(dirname "$toml")" | tr "-" "_")"
            python -c "import $module; $module.smoketest()"
          done

  publish:
    name: publish wheels
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PAT }}
        run: ./release.sh
