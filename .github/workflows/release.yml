name: release wheels

on:
  push:
    branches: [master]

jobs:
  build:
    name: build - ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
          - platform: macos
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: "3.14"

      - name: Build, smoketest, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ./build.sh --manylinux --publish
          else
            ./build.sh --publish
          fi

  publish-shims:
    name: publish releases branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish shim packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build.sh --publish-shims
