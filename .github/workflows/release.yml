name: release wheels

on:
  push:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.package }} - ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        package: [gcc-arm-none-eabi]
        runs-on: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: build wheel
        run: |
          pip install build
          python -m build --wheel "${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.runs-on }}
          path: ${{ matrix.package }}/dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        package: [gcc-arm-none-eabi]
    steps:
      - uses: actions/checkout@v6

      - name: get version
        run: |
          VERSION=$(python3 -c "
          import tomllib
          print(tomllib.load(open('${{ matrix.package }}/pyproject.toml', 'rb'))['project']['version'])
          ")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.package }}-*
          merge-multiple: true
          path: wheels

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.package }}/v${VERSION}"
          ls -lh wheels/
          # update existing release or create new one
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh release upload "$TAG" wheels/*.whl --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" wheels/*.whl \
              --repo "$GITHUB_REPOSITORY" \
              --title "${{ matrix.package }} v${VERSION}" \
              --notes "Platform wheels for ${{ matrix.package }} ${VERSION}"
          fi
