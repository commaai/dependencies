[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qt5"
version = "5.15.2"
description = "Minimal Qt5 build for cabana (shared libraries)"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["qt5*"]

[tool.setuptools.package-data]
qt5 = ["install/**/*"]
