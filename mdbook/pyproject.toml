[build-system]
requires = ["setuptools>=64", "wheel", 'tomli; python_version < "3.11"']
build-backend = "setuptools.build_meta"

[project]
name = "mdbook"
version = "0.5.2"
description = "mdBook command-line tool for creating books from Markdown (pre-built)"
requires-python = ">=3.8"

[project.scripts]
"mdbook" = "mdbook:_run"

[tool.setuptools.packages.find]
include = ["mdbook*"]

[tool.setuptools.package-data]
mdbook = ["bin/**/*", "*.so"]

[tool.shim]
repo_url = "https://github.com/commaai/dependencies"
tag = "mdbook/v0.5.2"
datadir = "bin"
