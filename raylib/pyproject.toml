[build-system]
requires = ["setuptools>=70.1", "cffi>=1.17.1", "nanobind==3.1.0", "numpy"]  # numpy for raylib_nb's tests
build-backend = "setuptools.build_meta"

[project]
name = "comma-deps-raylib"
version = "6.0.0.1"
description = "raylib with CFFI and nanobind Python bindings (commaai fork)"
requires-python = ">=3.12"
dependencies = ["cffi>=1.17.1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["raylib", "pyray"]
namespaces = false

[tool.setuptools.package-data]
raylib = ["_raylib_cffi*.so", "install/include/*.h", "install/lib/*.a"]
