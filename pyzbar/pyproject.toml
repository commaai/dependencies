[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzbar"
version = "0.1.9"
description = "pyzbar barcode reader with bundled zbar library"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["pyzbar*"]

[tool.setuptools.package-data]
pyzbar = ["install/**/*"]
